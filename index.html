<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Magic Doodle</title>
    <meta name="theme-color" content="#0b1220" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css?v=11" />
    <link rel="icon" href="./icons/icon_192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon_192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <header>
      <nav class="toolbar" id="toolbar" aria-label="おえかきどうぐ">
        <button id="colorBtn" aria-expanded="false" aria-controls="colorPanel"><span class="swatch" id="swatch" style="background:#fff"></span> いろ</button>
        <button id="behaviorBtn" aria-expanded="false" aria-controls="motionPanel">🎬 うごき</button>
        <button id="brushBtn" aria-expanded="false" aria-controls="penPanel">🖌 ぺん</button>
        <button id="animateBtn">▶️ うごく</button>
        <button id="clearBtn">🧼 けす</button>
      </nav>
      <section id="colorPanel" class="popover" aria-label="いろをえらぶ" hidden>
        <span id="brushLabel">しろ</span><div id="palette"></div>
      </section>
      <section id="motionPanel" class="popover" aria-label="うごきをえらぶ" hidden></section>
      <section id="penPanel" class="popover" aria-label="ぺんをえらぶ" hidden>
        <label for="size">ふとさ</label><input id="size" aria-label="ぺんのふとさ" type="range" min="4" max="40" value="14" />
      </section>
    </header>
    <canvas id="canvas" aria-label="おえかきキャンバス"></canvas>
    <script src="./app.js?v=11" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
      }
    </script>
  </body>
</html>
